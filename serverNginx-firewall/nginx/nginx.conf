<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fsoocie.dat</title>
    <style>
        /* Fundo preto estilo terminal */
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Container do Botￃﾣo inicial */
        .intro-container {
            text-align: center;
            transition: opacity 0.5s ease;
        }

        /* CSS do Botￃﾣo bem destacado e cyber/hacker */
        .join-btn {
            background-color: transparent;
            color: #ff003c; /* Vermelho neon destacado */
            border: 2px solid #ff003c;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
            transition: all 0.3s ease;
        }

        /* Efeito de hover no botￃﾣo */
        .join-btn:hover {
            background-color: #ff003c;
            color: #000;
            box-shadow: 0 0 30px #ff003c;
            text-shadow: none;
        }

        /* Container da imagem (escondido por padrￃﾣo) */
        .image-container {
            display: none;
            opacity: 0;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            position: absolute;
        }

        /* Classe que o JavaScript vai injetar para rodar a animaￃﾧￃﾣo de fade-in */
        .image-container.active {
            display: flex;
            animation: fadeInTotal 1s forwards;
        }

        /* A imagem em si com o efeito de piscar contￃﾭnuo */
        .fsociety-img {
            max-width: 80%;
            max-height: 80vh;
            object-fit: contain;
            animation: piscar 1.5s infinite steps(1);
        }

        /* Animaￃﾧￃﾣo para fazer a tela surgir do preto */
        @keyframes fadeInTotal {
            to { opacity: 1; }
        }

        /* O efeito clￃﾡssico de piscar da imagem */
        @keyframes piscar {
            0%   { opacity: 1; }
            5%   { opacity: 0; }
            10%  { opacity: 1; }
            15%  { opacity: 1; }
            20%  { opacity: 0; }
            25%  { opacity: 1; }
            80%  { opacity: 1; }
            85%  { opacity: 0; }
            90%  { opacity: 1; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="intro-container" id="introBox">
        <button class="join-btn" onclick="startHack()">Join Us</button>
    </div>

    <div class="image-container" id="imageBox">
        <img src="fsociety.jpg" alt="fsociety" class="fsociety-img">
    </div>

    <script>
        function startHack() {
            const introBox = document.getElementById('introBox');
            const imageBox = document.getElementById('imageBox');

            // Esconde o botￃﾣo sumindo com a opacidade
            introBox.style.opacity = '0';

            // Aguarda 500ms (tempo do fade-out do botￃﾣo) para sumir com ele e exibir a imagem animada
            setTimeout(() => {
                introBox.style.display = 'none';
                imageBox.classList.add('active');
            }, 500);
        }
    </script>

</body>
</html>

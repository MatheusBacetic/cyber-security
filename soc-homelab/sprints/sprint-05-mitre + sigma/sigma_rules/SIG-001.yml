title: Suspicious PowerShell Encoded Command Execution
id: 4d1e3c2a-9f6a-4c1a-8b52-0c9d8e7f4a11
status: experimental
description: Detects PowerShell execution using encoded commands, which may indicate command obfuscation.
author: Matheus Bacetic
date: 2026-07-02
references:
  - https://attack.mitre.org/techniques/T1059/001/
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    - Image|endswith: '\powershell.exe'
    - OriginalFileName: 'PowerShell.EXE'
  selection_commandline:
    CommandLine|contains:
      - ' -enc '
      - ' -encodedcommand '
      - ' -e '
  condition: selection_image and selection_commandline
falsepositives:
  - Administrative scripts that intentionally use encoded PowerShell commands
level: medium